<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WaterLeak Alert</title>
<style>
:root{--bg:#eef5f6;--surf:#fff;--ink:#0b2a33;--mut:#55727b;--line:#d3e2e5;--pri:#0e6b7e;--pri-ink:#fff;--warn:#d4521b;--ok:#1f8a5b;--warnbg:#fde8dd;--okbg:#dff3e9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#07181d;--surf:#0f2a31;--ink:#e6f3f5;--mut:#8fb0b8;--line:#1f4048;--pri:#4fc3d9;--pri-ink:#04222a;--warn:#ff8a57;--ok:#4fd39a;--warnbg:#3a1d10;--okbg:#0e3326}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#07181d;--surf:#0f2a31;--ink:#e6f3f5;--mut:#8fb0b8;--line:#1f4048;--pri:#4fc3d9;--pri-ink:#04222a;--warn:#ff8a57;--ok:#4fd39a;--warnbg:#3a1d10;--okbg:#0e3326}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;min-height:100vh}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.drop{width:28px;height:28px}
.sim{font-size:12px;background:var(--warnbg);color:var(--warn);padding:4px 10px;border-radius:99px;font-weight:600}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.warn{background:var(--warn);color:#fff}
.mut{color:var(--mut);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{background:none;border:0;padding:6px 4px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--pri);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.status{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none}
.dot.bad{background:var(--warn);box-shadow:0 0 0 6px var(--warnbg)}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero.bad{border-color:var(--warn)}
.big{font-size:28px;font-weight:800}
.sensor{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sensor:last-child{border:0}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.tag.bad{background:var(--warnbg);color:var(--warn)}
.seg{display:inline-flex;border:1.5px solid var(--pri);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{background:none;border:0;padding:8px 14px;color:var(--pri);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.alert{border-left:5px solid var(--warn);padding:10px 12px;background:var(--warnbg);border-radius:10px;margin-bottom:10px}
.alert.done{border-color:var(--ok);background:var(--okbg)}
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:90%;font-size:14px}
.switch{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.switch input{width:22px;height:22px}
.auth{max-width:400px;margin:8vh auto 0}
.banner{background:var(--warn);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:600;display:none}
.banner.on{display:block}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.dot.bad{animation:p 1.4s infinite}@keyframes p{50%{box-shadow:0 0 0 12px transparent}}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2"/>',bell:'<path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4" fill="none" stroke="currentColor" stroke-width="2"/>',chart:'<path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6" fill="none" stroke="currentColor" stroke-width="2"/>',wrench:'<path d="M14 6a4 4 0 0 0 5 5l-9 9a2 2 0 0 1-3-3l9-9a4 4 0 0 0-2-2z" fill="none" stroke="currentColor" stroke-width="2"/>',leaf:'<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19l8-8" fill="none" stroke="currentColor" stroke-width="2"/>',gear:'<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" stroke-width="2"/>'};
var DROP='<svg class="drop" viewBox="0 0 24 24"><path d="M12 2C8 8 5 11 5 15a7 7 0 0 0 14 0c0-4-3-7-7-13z" fill="#0e6b7e"/><path d="M9 15a3 3 0 0 0 3 3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
function rnd(seed){var s=seed;return function(){s=(s*9301+49297)%233280;return s/233280}}
var r=rnd(7);
var usage={daily:[],weekly:[],monthly:[]};
['6am','9am','12pm','3pm','6pm','9pm'].forEach(function(l,i){usage.daily.push([l,Math.round([14,38,22,18,52,30][i]+r()*4)])});
['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(l){usage.weekly.push([l,Math.round(120+r()*70)])});
['Wk 1','Wk 2','Wk 3','Wk 4'].forEach(function(l,i){usage.monthly.push([l,Math.round(900+r()*250+(i==2?220:0))])});
var S={user:null,tab:'home',range:'daily',
sensors:[{id:'kitchen',name:'Kitchen sink',wet:false},{id:'bath',name:'Bathroom',wet:false},{id:'tank',name:'Water tank',wet:false},{id:'garden',name:'Garden pipe joint',wet:false}],
alerts:[{id:1,loc:'Water tank',time:'12 Nov, 07:42',done:true,note:'Loose fitting tightened'}],
requests:[{id:1,plumber:'Nimal Perera',issue:'Tank fitting',status:'Completed',date:'12 Nov'}],
plumbers:[{n:'Nimal Perera',a:'Colombo 05',s:'Pipe repair, tanks',t:'+94 77 123 4567',r:4.8},{n:'Kasun Silva',a:'Nugegoda',s:'Leak detection',t:'+94 71 234 5678',r:4.6},{n:'Fernando Plumbing',a:'Dehiwala',s:'Bathrooms, kitchens',t:'+94 76 345 6789',r:4.5},{n:'Ruwan Jayasuriya',a:'Kandy',s:'Emergency repairs',t:'+94 70 456 7890',r:4.4}],
prefs:{push:true,email:true,limit:false},prop:'My Home',toastMsg:''};
function $(h){return h}
function leaking(){return S.sensors.filter(function(x){return x.wet})}
function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function now(){var d=new Date();return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function toggleLeak(id){var s=S.sensors.find(function(x){return x.id==id});s.wet=!s.wet;
if(s.wet){S.alerts.unshift({id:Date.now(),loc:s.name,time:now(),done:false,note:''});toast('Leak alert: '+s.name)}
else{var a=S.alerts.find(function(x){return x.loc==s.name&&!x.done});if(a){a.done=true;a.note='Sensor dry again'}toast('Sensor dry: '+s.name)}
render()}
function chart(data){var w=600,h=240,p=30,max=Math.max.apply(null,data.map(function(d){return d[1]}))*1.15,bw=(w-p*2)/data.length,o='<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Water usage chart in litres">';
for(var g=0;g<4;g++){var y=p+(h-p*2)*g/3;o+='<line x1="'+p+'" x2="'+(w-p)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/>'}
data.forEach(function(d,i){var bh=(h-p*2)*d[1]/max,x=p+i*bw+bw*.18,y=h-p-bh;o+='<rect x="'+x+'" y="'+y+'" width="'+bw*.64+'" height="'+bh+'" rx="6" fill="var(--pri)"/><text x="'+(x+bw*.32)+'" y="'+(y-6)+'" text-anchor="middle" font-size="13" fill="var(--ink)">'+d[1]+'</text><text x="'+(x+bw*.32)+'" y="'+(h-8)+'" text-anchor="middle" font-size="13" fill="var(--mut)">'+d[0]+'</text>'});
return o+'</svg>'}
function auth(){return '<div class="wrap auth"><div class="brand" style="justify-content:center;margin-bottom:6px">'+DROP+'WaterLeak Alert</div><p class="mut" style="text-align:center;margin:0 0 18px">Detect early, save water, prevent damage.</p><form class="card" id="af"><h2 id="at">Log in</h2><div id="nm" style="display:none"><label for="n">Full name</label><input id="n" autocomplete="name"></div><label for="e">Email</label><input id="e" type="email" required autocomplete="email"><label for="p">Password</label><input id="p" type="password" required minlength="6" autocomplete="current-password"><div id="pr" style="display:none"><label for="pp">Property name</label><input id="pp" placeholder="My Home"></div><button class="btn" style="width:100%;margin-top:16px" type="submit" id="ab">Log in</button><p class="mut" style="text-align:center"><button type="button" id="sw" style="background:none;border:0;color:var(--pri);font-weight:600">Create an account</button></p><p class="mut" style="text-align:center;margin:0">Demo only: any email and a 6+ character password will work.</p></form></div>'}
function home(){var L=leaking(),bad=L.length>0;
return '<div class="banner'+(bad?' on':'')+'" role="alert">Possible leak detected at: '+esc(L.map(function(x){return x.name}).join(', '))+'. Check the area now.</div>'+
'<div class="card hero'+(bad?' bad':'')+'"><span class="dot'+(bad?' bad':'')+'"></span><div><div class="big">'+(bad?'Leak detected':'All clear')+'</div><div class="mut">'+esc(S.prop)+' · '+S.sensors.length+' sensors online</div></div>'+(bad?'<button class="btn warn" data-go="repair" style="margin-left:auto">Find a plumber</button>':'')+'</div>'+
'<div class="grid"><div class="card"><div class="mut">Used today</div><div class="big">'+usage.daily.reduce(function(a,d){return a+d[1]},0)+' L</div></div><div class="card"><div class="mut">Open alerts</div><div class="big">'+S.alerts.filter(function(a){return !a.done}).length+'</div></div><div class="card"><div class="mut">Repair requests</div><div class="big">'+S.requests.length+'</div></div></div>'+
'<div class="card"><h3>Sensors</h3><p class="mut">Use the button to simulate a sensor getting wet.</p>'+S.sensors.map(function(s){return '<div class="sensor"><div><strong>'+s.name+'</strong><br><span class="tag'+(s.wet?' bad':'')+'">'+(s.wet?'Water detected':'Dry')+'</span></div><button class="btn ghost" data-leak="'+s.id+'">'+(s.wet?'Mark dry':'Simulate leak')+'</button></div>'}).join('')+'</div>'+
'<div class="card"><h3>Example alert</h3><p class="mut" style="margin-bottom:0">A possible water leak has been detected by the Kitchen sensor. Please check the area immediately to prevent more water loss or damage.</p></div>'}
function alerts(){return '<h2 style="margin-bottom:12px">Leak alerts</h2>'+(S.alerts.length?S.alerts.map(function(a){return '<div class="alert'+(a.done?' done':'')+'"><div class="row"><strong>'+esc(a.loc)+'</strong><span class="tag'+(a.done?'':' bad')+'">'+(a.done?'Resolved':'Open')+'</span></div><div class="mut">'+a.time+(a.note?' · '+esc(a.note):'')+'</div>'+(a.done?'':'<div class="ph"><button class="btn" data-go="repair">Request repair</button><button class="btn ghost" data-resolve="'+a.id+'">Mark resolved</button></div>')+'</div>'}).join(''):'<div class="card mut">No alerts yet. Simulate a leak on the Home screen to see one.</div>')}
function usageV(){var d=usage[S.range],t=d.reduce(function(a,x){return a+x[1]},0),mx=d.reduce(function(a,x){return x[1]>a[1]?x:a},d[0]),av=t/d.length,spike=mx[1]>av*1.5;
return '<h2 style="margin-bottom:12px">Water usage</h2><div class="seg" role="group" aria-label="Range">'+['daily','weekly','monthly'].map(function(k){return '<button data-range="'+k+'" aria-pressed="'+(S.range==k)+'">'+k[0].toUpperCase()+k.slice(1)+'</button>'}).join('')+'</div><div class="card">'+chart(d)+'<p class="mut" style="margin:8px 0 0">Litres from the flow sensor (simulated).</p></div><div class="grid"><div class="card"><div class="mut">Total</div><div class="big">'+t+' L</div></div><div class="card"><div class="mut">Highest</div><div class="big">'+mx[0]+'</div></div></div>'+(spike?'<div class="alert"><strong>Unusual flow</strong><div class="mut">'+mx[0]+' used far more than the average. Check for dripping taps or a hidden leak.</div></div>':'')}
function repair(){return '<h2 style="margin-bottom:12px">Repair services</h2>'+S.plumbers.map(function(p,i){return '<div class="card"><div class="row"><strong>'+p.n+'</strong><span class="tag">★ '+p.r+'</span></div><div class="mut">'+p.a+' · '+p.s+'</div><div class="ph"><a class="btn ghost" style="text-decoration:none" href="tel:'+p.t.replace(/\s/g,'')+'">Call '+p.t+'</a><button class="btn" data-req="'+i+'">Send request</button></div></div>'}).join('')+
'<div class="card"><h3>Request history</h3>'+S.requests.map(function(q){return '<div class="sensor"><div><strong>'+esc(q.plumber)+'</strong><div class="mut">'+esc(q.issue)+' · '+q.date+'</div></div><span class="tag'+(q.status=='Completed'?'':' bad')+'">'+q.status+'</span></div>'}).join('')+'</div>'}
function saving(){var t=usage.monthly.reduce(function(a,x){return a+x[1]},0),res=S.alerts.filter(function(a){return a.done}).length;
return '<h2 style="margin-bottom:12px">Water-saving summary</h2><div class="grid"><div class="card"><div class="mut">Monthly use</div><div class="big">'+t+' L</div></div><div class="card"><div class="mut">Leaks found</div><div class="big">'+S.alerts.length+'</div></div><div class="card"><div class="mut">Leaks fixed</div><div class="big">'+res+'</div></div><div class="card"><div class="mut">Estimated saved</div><div class="big">~'+res*180+' L</div></div></div><p class="mut">Savings are estimates only. Real savings are measured by comparing water loss before and after a repair.</p><div class="card"><h3>Tips</h3><ul style="padding-left:20px;margin:8px 0 0"><li>Fix dripping taps. One drip a second can waste thousands of litres a year.</li><li>Check tank floats and overflow pipes every month.</li><li>Read your meter before and after an hour of no use. If it moves, you have a leak.</li><li>Place leak sensors under sinks and next to pipe joints.</li></ul></div>'}
function settings(){return '<h2 style="margin-bottom:12px">Profile and settings</h2><div class="card"><label for="pn">Property name</label><input id="pn" value="'+esc(S.prop)+'"><div style="margin-top:12px"><button class="btn" id="sp">Save changes</button></div></div><div class="card"><h3>Notifications</h3>'+[['push','Push notifications'],['email','Email alerts'],['limit','Alert when daily limit is reached']].map(function(k){return '<label class="switch" style="margin:0"><span>'+k[1]+'</span><input type="checkbox" data-pref="'+k[0]+'"'+(S.prefs[k[0]]?' checked':'')+'></label>'}).join('')+'</div><div class="card"><h3>Privacy</h3><p class="mut" style="margin:6px 0 0">We only collect the contact and property details needed for alerts and repair requests.</p></div><button class="btn ghost" id="lo">Log out</button>'}
var T=[['home','Home','home'],['alerts','Alerts','bell'],['usage','Usage','chart'],['repair','Repair','wrench'],['saving','Saving','leaf'],['settings','Settings','gear']];
var V={home:home,alerts:alerts,usage:usageV,repair:repair,saving:saving,settings:settings};
var mode='login';
function render(){var a=document.getElementById('app');
if(!S.user){a.innerHTML=auth();bindAuth();return}
a.innerHTML='<div class="wrap"><header class="top"><div class="brand">'+DROP+'WaterLeak Alert</div><span class="sim">Simulated data</span></header><main>'+V[S.tab]()+'</main></div><nav class="tabs" aria-label="Main">'+T.map(function(t){return '<button data-tab="'+t[0]+'"'+(S.tab==t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24">'+I[t[2]]+'</svg>'+t[1]+'</button>'}).join('')+'</nav>'}
function bindAuth(){var f=document.getElementById('af');
document.getElementById('sw').onclick=function(){mode=mode=='login'?'reg':'login';var g=mode=='reg';document.getElementById('at').textContent=g?'Create account':'Log in';document.getElementById('ab').textContent=g?'Create account':'Log in';document.getElementById('nm').style.display=document.getElementById('pr').style.display=g?'block':'none';this.textContent=g?'I already have an account':'Create an account'};
f.onsubmit=function(e){e.preventDefault();S.user=document.getElementById('n').value||document.getElementById('e').value;S.prop=document.getElementById('pp').value||S.prop;render()}}
document.addEventListener('click',function(e){var t=e.target.closest('[data-tab],[data-go],[data-leak],[data-range],[data-resolve],[data-req],#sp,#lo');if(!t)return;
if(t.dataset.tab||t.dataset.go){S.tab=t.dataset.tab||t.dataset.go;render();window.scrollTo(0,0)}
else if(t.dataset.leak)toggleLeak(t.dataset.leak);
else if(t.dataset.range){S.range=t.dataset.range;render()}
else if(t.dataset.resolve){var a=S.alerts.find(function(x){return x.id==t.dataset.resolve});a.done=true;a.note='Resolved by user';S.sensors.forEach(function(s){if(s.name==a.loc)s.wet=false});toast('Alert resolved');render()}
else if(t.dataset.req){var p=S.plumbers[t.dataset.req],o=S.alerts.find(function(x){return !x.done});S.requests.unshift({id:Date.now(),plumber:p.n,issue:o?o.loc+' leak':'General inspection',status:'Sent',date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})});toast('Request sent to '+p.n);render()}
else if(t.id=='sp'){S.prop=document.getElementById('pn').value||S.prop;toast('Changes saved')}
else if(t.id=='lo'){S.user=null;render()}});
document.addEventListener('change',function(e){if(e.target.dataset.pref){S.prefs[e.target.dataset.pref]=e.target.checked;toast('Settings saved')}});
render();
</script>
</body>
</html>
